[project]
name = "mlchallenge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python==5.0.0.93",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.29.0", # required by transformers>=5's AutoImageProcessor; not imported directly
    "transformers>=4.40,<6",
]

[project.optional-dependencies]
live = [                          # the live demo's capture stack (scripts/live_demo.py)
    "sounddevice>=0.5",           # microphone (bundles PortAudio on macOS)
    "webrtcvad-wheels>=2.0.14",   # VAD end-of-speech
    "av>=14",                     # --source <video file>: decode its audio track
]
mlx = [                           # Apple-silicon runtimes for the response LM and ASR
    "mlx-lm>=0.20; sys_platform == 'darwin'",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meld_emotion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = [
    "network: downloads pretrained weights from Hugging Face; deselected by default, run with `uv run pytest -m network`",
]
